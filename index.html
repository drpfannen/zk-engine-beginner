<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- (ours) TODO: beginner-fork title/branding not decided yet — still using the parent app's "Daddy → Baddie" name as a placeholder -->
<title>Daddy → Baddie</title>
<style>
:root{
  --bg:#0b1322; --surface:#131f33; --surface2:#1b2b45; --line:#27395580;
  --text:#eef4ff; --muted:#a3b6d1; --faint:#7e93b3;
  --accent:#28d9f2; --accent2:#0ea5c9; --accentdim:#0f4557;
  --copper1:#b9c9de; --copper2:#516883;
  --green:#3ee08f; --amber:#ffc457; --red:#ff6b6b;
  --squat:#ffc457; --bench:#ff6ec7; --deadlift:#a78bfa;
  /* (ours) beginner-fork palette scaffold — unused placeholders aliased to the current palette so nothing
     renders differently yet; naming/colors not finalized. */
  --beginner-accent:var(--accent); --beginner-bg:var(--bg);
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,"SF Pro Display","SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.45;
  font-size:16px;padding:max(env(safe-area-inset-top),0px) 0 64px;
  background-image:radial-gradient(1100px 420px at 82% -12%,rgba(40,217,242,.07),transparent),radial-gradient(760px 320px at 0% 4%,rgba(167,139,250,.05),transparent)}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
header{padding:24px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;justify-content:center;align-items:center;gap:12px}
.brand h1{display:flex;align-items:center;gap:11px;font-size:27px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.bd1{background:linear-gradient(180deg,#e8eff9,#a9bcd4 45%,#63799a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.bdar{color:var(--accent);font-size:20px;opacity:.9}
.bd2{color:var(--accent);text-shadow:0 0 12px rgba(40,217,242,.55),0 0 28px rgba(40,217,242,.25)}
.brand .v{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.tag{color:var(--muted);font-size:13px;margin-top:6px;max-width:52ch}
.tag b{color:var(--text);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.panel>h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#0d1826;
  padding:13px 16px;
  background:linear-gradient(180deg,#dde7f5,#b3c4da 42%,#8397b4 58%,#63789a);font-weight:800;
  display:flex;justify-content:center;align-items:center;gap:10px;text-align:center;border-bottom:1px solid rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.panel .body{padding:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.field label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:12px 12px;font-family:var(--mono);font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(40,217,242,.18)}
.maxes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.maxcard{background:linear-gradient(180deg,#1b2b45,#152238);border:1px solid rgba(140,166,200,.3);border-radius:14px;padding:13px 6px 11px;display:flex;flex-direction:column;align-items:center;gap:5px}
.maxcard label{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.maxcard input{width:100%;background:transparent;border:none;color:var(--text);font-family:var(--sans);font-weight:800;font-size:30px;line-height:1;text-align:center;outline:none;padding:0;-moz-appearance:textfield}
.maxcard input:focus{color:var(--accent)}
.maxcard input::-webkit-outer-spin-button,.maxcard input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.maxcard .bbsvg{width:84%;height:auto;margin-top:3px;display:block}
.maxcard.sq{color:var(--squat);border-color:rgba(255,196,87,.4)}
.maxcard.bn{color:var(--bench);border-color:rgba(255,110,199,.4)}
.maxcard.dl{color:var(--deadlift);border-color:rgba(167,139,250,.4)}

.btn{appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:15px 18px;border-radius:11px;
  background:linear-gradient(180deg,#3ee3fb,#12b8dd);color:#052532;margin-top:16px;width:100%;transition:filter .15s;box-shadow:0 2px 14px rgba(40,217,242,.22)}
.btn:hover{filter:brightness(1.08)}.btn:active{filter:brightness(.94)}

.tabs{display:flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;background:none;border:none;color:var(--muted);font-family:var(--sans);font-weight:700;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:11px 8px;border-radius:7px;cursor:pointer;transition:color .12s,background .12s}
.tabs button.on{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent),0 0 14px rgba(40,217,242,.18)}
.hidden{display:none}

.cyc{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap}
.cyc b{color:var(--accent2)}

.block{border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow:hidden}
.block .bhead{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.block .idx{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.block .phase{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:capitalize}
.block .wks{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.block.taper .phase{color:var(--accent)}
.block .ratio{font-family:var(--mono);font-size:10px;color:var(--faint);padding:0 14px;margin:9px 0 3px;letter-spacing:.04em}
.lift{padding:9px 14px;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:none}
.lift .lname{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;display:flex;justify-content:space-between}
.lift .lname .zones{font-family:var(--mono);color:var(--faint);letter-spacing:0}
.work{display:flex;align-items:center;gap:14px}
.work .big{font-family:var(--mono);font-weight:700;font-size:26px;min-width:96px}
.work .big .u{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.work .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.work .meta .z{color:var(--accent2)}

/* barbell plate graphic */
.bbcol{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.bbwrap{display:flex;align-items:center;justify-content:center;min-height:80px;max-width:100%;overflow-x:auto;padding:4px 0}
.bbside{display:flex;align-items:center;gap:1px}
.bbline{width:120px;height:8px;flex:none;background:linear-gradient(180deg,#e4e8ee,#b4b9c3 46%,#828692 56%,#50535c);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.55)}
.bbsleeve{width:22px;height:9px;flex:none;background:linear-gradient(180deg,#dfe3ea,#aeb3bd 46%,#787c86 56%,#4a4d56);border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.5)}
.bbcap{width:5px;height:15px;flex:none;background:linear-gradient(180deg,#c6cad2,#666a74);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.collar{width:9px;height:26px;flex:none;background:linear-gradient(180deg,#c8ccd4,#8e929c 48%,#5c606a);border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 3px rgba(0,0,0,.5);margin:0 1px}
.platev{flex:none;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 2px 5px rgba(0,0,0,.5)}
.bbsum{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--muted)}
.baronly{font-family:var(--mono);font-size:11px;color:var(--faint);padding:14px 0}

.dsel{flex-wrap:wrap;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.dayhdr{font-family:var(--sans);font-size:14px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#0d1826;text-shadow:0 1px 0 rgba(255,255,255,.3);
  background:linear-gradient(180deg,#dde7f5,#b3c4da 42%,#8397b4 58%,#63789a);border:1px solid rgba(0,0,0,.3);border-radius:12px;
  padding:13px 16px;text-align:center;margin:2px 0 16px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.dayhdr .donebadge{color:#0a3a24;font-weight:700}
.daysub{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--muted);text-align:center;margin:-8px 0 16px}
.phaseov{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin:-8px 0 16px}
.rebasecard{background:var(--surface);border:1px solid var(--accent);border-left:3px solid var(--accent);border-radius:12px;padding:14px 15px;margin:0 0 16px}
.rbhd{font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.rbsub{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:11px}
.rbrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--line)}
.rbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);min-width:62px}
.rbnum{font-family:var(--mono);font-size:15px;color:var(--muted)}
.rbnum b{color:var(--text);font-size:17px}
.rbarrow{color:var(--faint);margin:0 6px}
.rbmeta{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
.rbbtns{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.rbbtn{flex:1;min-width:130px;font-family:var(--sans);font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(180deg,#3ee3fb,#12b8dd);color:#052532;border:none;border-radius:10px;padding:12px 14px;cursor:pointer}
.rbbtn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rbbtn.ghost:hover{border-color:var(--muted);color:var(--text)}
.povl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.povsel{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:11px;outline:none;cursor:pointer}
.povsel:focus{border-color:var(--accent)}
.povtag{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);border:1px solid var(--amber);border-radius:20px;padding:3px 9px}
.povreset{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:7px;font-family:var(--mono);font-size:10px;padding:5px 9px;cursor:pointer}
.povreset:hover{border-color:var(--accent);color:var(--accent)}
.ex{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:var(--surface);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.ex.downreg{border-color:var(--amber)}
.exhead{display:flex;align-items:center;gap:10px;padding:12px 15px;background:linear-gradient(180deg,#22344f,#1b2b45);border-bottom:1px solid var(--line)}
.exname{font-weight:700;font-size:15px}
.exbadge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.exbadge.ME{color:var(--accent);border-color:rgba(40,217,242,.5);background:rgba(40,217,242,.1)}
.exbadge.DE{color:var(--bench);border-color:rgba(255,110,199,.45);background:rgba(255,110,199,.1)}
.exbadge.RE{color:var(--squat);border-color:rgba(255,196,87,.45);background:rgba(255,196,87,.1)}
.exmain{display:flex;flex-direction:column;align-items:center;gap:11px;padding:16px 14px 6px}
.exbig{font-family:var(--sans);font-weight:800;font-size:30px;letter-spacing:-.01em;text-align:center}
.exbig .x{color:var(--faint);margin:0 4px;font-weight:400}
.exbig .exat{font-size:18px;color:var(--muted);font-weight:600;margin-left:8px}
.exbig .exat .u{font-size:12px}
.exmeta{font-family:var(--mono);font-size:11px;color:var(--muted);padding:2px 14px 14px;text-align:center;line-height:1.55}
.exmeta .dr{color:var(--amber)}
.exslot{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:700;margin-right:9px}
.ex.acc .exhead{background:var(--surface)}
.exbadge.acc{color:var(--muted)}
.excue{font-size:12px;color:var(--muted);line-height:1.55;padding:10px 14px 12px;border-top:1px dashed var(--line)}
.tierlab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:16px 0 8px}
.today-ctl{margin-bottom:16px}
.slider{margin-bottom:14px}
.slider .srow{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.slider .srow b{font-family:var(--mono);color:var(--text);font-size:13px}
input[type=range]{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:var(--surface2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}

.score{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:9px;margin-bottom:16px;border:1px solid var(--line)}
.score .num{font-family:var(--mono);font-size:34px;font-weight:700}
.score .band{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.score .desc{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;max-width:24ch}
.score.green{border-color:var(--green)} .score.green .num,.score.green .band{color:var(--green)}
.score.amber{border-color:var(--amber)} .score.amber .num,.score.amber .band{color:var(--amber)}
.score.red{border-color:var(--red)} .score.red .num,.score.red .band{color:var(--red)}
.rbanner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin:18px 0 4px}
.rlabel{font-family:var(--sans);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}
.rtop{display:flex;align-items:center;gap:12px}
.rscorebox{font-family:var(--sans);font-weight:800;font-size:30px;line-height:1;padding:10px 16px;border-radius:10px;flex-shrink:0;min-width:66px;text-align:center}
.rbanner.green .rscorebox{background:rgba(46,213,115,.14);color:var(--green);border:1px solid rgba(46,213,115,.42)}
.rbanner.amber .rscorebox{background:rgba(219,162,63,.14);color:var(--amber);border:1px solid rgba(219,162,63,.42)}
.rbanner.red .rscorebox{background:rgba(224,86,62,.14);color:var(--red);border:1px solid rgba(224,86,62,.42)}
.rwavewrap{flex:1;height:44px;overflow:hidden;border-radius:8px;background:rgba(255,255,255,.02)}
.rwavesvg{width:200%;height:100%;display:block}
.rwg{animation:rwscroll 3.4s linear infinite}
@keyframes rwscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rwline{fill:none;stroke-width:2}.rwline.b{stroke-width:1.5}
.rbanner.green .rwline{stroke:var(--green)}.rbanner.green .rwline.b{stroke:var(--accent);opacity:.35}
.rbanner.amber .rwline{stroke:var(--amber)}.rbanner.amber .rwline.b{stroke:var(--accent);opacity:.28}
.rbanner.red .rwline{stroke:var(--red)}.rbanner.red .rwline.b{stroke:var(--accent);opacity:.28}
.rsig{font-size:12px;color:var(--muted);margin-top:12px}.rsig b{color:var(--text)}

.modrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.modrow .ml{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:74px}
.modrow .from{font-family:var(--mono);color:var(--faint);font-size:13px;text-decoration:line-through}
.modrow .arrow{color:var(--faint)}
.modrow .to{font-family:var(--mono);font-weight:700;font-size:17px}
.modrow .act{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:2px 5px;margin-left:auto;opacity:.85}
.modrow.same .to{color:var(--green)} .modrow.same .from{display:none}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:7px;padding:11px 13px;margin-top:6px;line-height:1.5}
.note b{color:var(--text)}
.logpanel{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:14px}
.logh{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.rampbox{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:16px;background:var(--bg)}
.ramphd2{font-family:var(--sans);font-weight:800;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.rampsrc{font-family:var(--mono);font-size:9px;font-weight:400;letter-spacing:.02em;color:var(--faint);text-transform:none}
.rampphase{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:9px 0 5px;display:flex;align-items:center;gap:7px}
.potsrc{font-size:8px;color:var(--faint);text-transform:none;letter-spacing:0}
.potsrc b{color:var(--muted)}
.wrow{display:grid;grid-template-columns:20px 1fr auto 28px;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px;background:var(--surface)}
.wrow.checked{opacity:.45}
.wrow.checked .wnm{color:var(--green)}
.wchk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;margin:0}
.wnm{font-size:13px;color:var(--text)}
.wds{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.wsw{background:transparent;border:1px solid var(--line);color:var(--faint);border-radius:5px;font-size:10px;padding:2px 5px;cursor:pointer;line-height:1}
.wsw:hover{border-color:var(--accent);color:var(--accent)}
.wswpanel{display:flex;flex-direction:column;gap:5px;margin:0 0 7px}
.wswpanel.hidden{display:none}
.potnote{font-size:11px;color:var(--muted);background:rgba(40,217,242,.07);border:1px solid rgba(40,217,242,.35);border-radius:8px;padding:8px 10px;margin:6px 0 2px;line-height:1.5}
.potnote b{color:var(--text)}
.potblock{border:1px solid rgba(40,217,242,.4);border-radius:10px;padding:9px 10px;margin:8px 0 10px;background:rgba(40,217,242,.04)}
.potbhd{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.potoffer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin:9px 0 2px}
.potofftxt{flex:1;min-width:150px;font-size:11px;color:var(--muted);line-height:1.5}
.potofftxt b{color:var(--text)}
.potadd{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:8px 14px;cursor:pointer}
.potadd:hover{background:rgba(40,217,242,.12)}
.potoff{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--faint);border-radius:5px;font-size:11px;line-height:1;padding:2px 7px;cursor:pointer}
.potoff:hover{border-color:var(--red);color:var(--red)}

  // src/e1rm.ts
  function epley(load, reps) {
    if (reps <= 1) return load;
    return load * (1 + reps / 30);
  }
  function eligibleForE1rm(s) {
    const okType = s.setType === "working" || s.setType === "amrap" || s.setType === "failure";
    return okType && s.reps <= 8 && s.rpe >= 8 && !s.downRegulated;
  }
  function e1rmFromHistory(sets, lift) {
    const elig = sets.filter((s) => s.lift === lift && eligibleForE1rm(s));
    if (elig.length === 0) return null;
    return Math.max(...elig.map((s) => epley(s.load, s.reps)));
  }

  // src/logger.ts
  function logAgainst(planned, actual, downRegulated = false) {
    return {
      lift: planned.lift,
      method: planned.method,
      setType: planned.setType,
      // inherited from the plan (free provenance)
      load: actual.load,
      reps: actual.reps,
      rpe: actual.rpe,
      downRegulated
    };
  }
  function rebaseline(prev, blockLog, lifts) {
    const out = { ...prev };
    for (const lift of lifts) {
      const derived = e1rmFromHistory(blockLog, lift);
      if (derived !== null) out[lift] = Math.max(prev[lift], derived);
    }
    return out;
  }
  function tonnageByMethod(sets) {
    const out = {};
    for (const s of sets) {
      if (s.setType === "warmup" || s.setType === "unknown") continue;
      const m = s.method ?? "?";
      out[m] = (out[m] ?? 0) + s.load * s.reps;
    }
    return out;
  }
  function cycleHandoff(args) {
    const newMaxes = {}, maxNotes = {};
    for (const l of args.lifts) {
      const base = args.maxes[l] || 0, adj = args.autoRegAdj[l] || 0;
      let nm, src;
      if (args.testResults[l] && args.testResults[l] > 0) {
        nm = Math.round(args.testResults[l]);
        src = "tested single";
      } else if (Math.abs(adj) > 1e-9) {
        nm = Math.round(base * (1 + adj));
        src = `autoreg ${adj > 0 ? "+" : "\u2212"}${Math.abs(adj * 100).toFixed(1)}%`;
      } else if (args.cycleE1rm[l] && args.cycleE1rm[l] > 0) {
        nm = Math.round(args.cycleE1rm[l]);
        src = "cycle e1RM";
      } else {
        nm = Math.round(base);
        src = "held \u2014 no new evidence";
      }
      newMaxes[l] = nm;
      const d = nm - Math.round(base);
      maxNotes[l] = `${src}${d !== 0 ? ` (${d > 0 ? "+" : "\u2212"}${Math.abs(d)})` : " (no change)"}`;
    }
    let lagging = args.lifts[0], best = Infinity;
    for (const l of args.lifts) {
      const n = newMaxes[l] / (args.ratioCoeffs[l] || 1);
      if (n < best) {
        best = n;
        lagging = l;
      }
    }
    return { newMaxes, maxNotes, lagging, ratioNote: `${lagging} sits furthest below the target strength ratio \u2014 next cycle favors it.` };
  }

  var VOL = {
    accumulative: { B: 2, C: 2 },
    transmutative: { B: 1, C: 1 },
    realizational: { B: 0, C: 1 },
    // taper — only light core/health work
    deload: { B: 1, C: 1 }
  };
  function selectAccessories(emphasis, phase, available, trim = false, excludeNames = [], rotate = 0) {
    let vol = VOL[phase] ?? { B: 1, C: 1 };
    if (trim) vol = { B: Math.max(0, vol.B - 1), C: Math.max(0, vol.C - 1) };
    const pool = ACCESSORIES.filter(
      (a) => a.emphasis.includes(emphasis) && a.equipment.every((e) => available.includes(e)) && !excludeNames.map((n) => n.trim().toLowerCase()).includes(a.name.trim().toLowerCase())
      // never repeat the day's main/speed movement as an accessory
    );
    const rot = (arr) => arr.length ? arr.slice(rotate % arr.length).concat(arr.slice(0, rotate % arr.length)) : arr;
    const Bs = rot(pool.filter((a) => a.tier === "B")).slice(0, vol.B).map((a, i) => ({ ...a, slot: `B${i + 1}` }));
    const Cs = rot(pool.filter((a) => a.tier === "C")).slice(0, vol.C).map((a, i) => ({ ...a, slot: `C${i + 1}` }));
    return [...Bs, ...Cs];
  }

function compDateObj(){ if(!state.compDate) return null; const p=state.compDate.split("-").map(Number); if(p.length!==3||p.some(isNaN)) return null; return new Date(p[0],p[1]-1,p[2]); }
function daysToComp(){ const c=compDateObj(); if(!c) return null; const n=new Date(); n.setHours(0,0,0,0); return Math.round((c-n)/86400000); }
function fmtCompDate(off){ const c=compDateObj(); if(!c) return ""; const d=new Date(c); d.setDate(d.getDate()-off); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
// (ours) meet attempt selection — a powerlifting convention, NOT a Z&K prescription.
// Basis = the higher of your Setup 1RM and your demonstrated e1RM (Epley on eligible sets), overridable per lift.
function attemptBasis(lift){
  const logs=logsIn(state.unit);
  const ser=e1rmSeries(lift,logs);
  const e1=ser.length?Math.max(...ser.map(p=>p.e1rm)):null;
  const singles=logs.filter(s=>s.lift===lift&&s.reps===1&&(s.setType==="working"||s.setType==="amrap")).map(s=>s.load);
  const bestSingle=singles.length?Math.max(...singles):null;
  const mx=state.maxes[lift]||0;
  const ov=(state.attemptBase||{})[lift];
  if(ov!=null&&ov>0) return {val:ov,src:"manual",e1:e1,mx:mx,bestSingle:bestSingle};
  return {val:Math.max(mx,e1||0),src:(e1!=null&&e1>mx)?"e1RM":"1RM",e1:e1,mx:mx,bestSingle:bestSingle};
}
function meetAttempts(lift){
  const b=attemptBasis(lift);
  const ATT=[["Opener",0.91,"a weight you could double on a bad day"],["Second",0.97,"at or near your best \u2014 this banks the total"],["Third",1.03,"PR territory"]];
  const dem=Math.max(b.bestSingle||0,b.e1||0);
  return ATT.map(a=>{
    const load=ZK.roundToPlates(a[1]*b.val,kit().plates,kit().bar);
    let warn=null;
    if(a[0]==="Opener"&&b.bestSingle!=null&&load>b.bestSingle) warn="heavier than anything you've hit \u2014 consider dropping it";
    else if(a[0]==="Third"&&dem>0&&load>dem*1.06) warn="a big jump past what you've demonstrated";
    return {name:a[0],pct:Math.round(a[1]*100),load:load,note:a[2],warn:warn};
  });
}
